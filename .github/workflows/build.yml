name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext

      - name: Check Android SDK
        run: |
          echo "========================================"
          echo "ANDROID ENVIRONMENT"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

          echo ""
          echo "Installed Build Tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo ""
          echo "Installed Android platforms:"
          ls -la "$ANDROID_HOME/platforms"

          echo ""
          echo "Installed NDK:"
          ls -la "$ANDROID_HOME/ndk"

          echo ""
          echo "Checking AIDL:"
          find "$ANDROID_HOME/build-tools" -name aidl -type f -print

          echo ""
          echo "Testing AIDL:"
          AIDL=$(find "$ANDROID_HOME/build-tools" -name aidl -type f | sort -V | tail -n 1)

          if [ -z "$AIDL" ]; then
            echo "ERROR: AIDL not found"
            exit 1
          fi

          echo "Using AIDL: $AIDL"
          "$AIDL" --help >/dev/null

          echo "AIDL OK"

      - name: Fix sdkmanager path for Buildozer
        run: |
          echo "========================================"
          echo "SDKMANAGER"
          echo "========================================"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"

            echo ""
            echo "cmdline-tools contents:"
            find "$ANDROID_HOME/cmdline-tools" \
              -maxdepth 5 \
              -type f \
              | head -100

            exit 1
          fi

          echo "Found sdkmanager:"
          echo "$SDKMANAGER"

          mkdir -p "$ANDROID_HOME/tools/bin"

          ln -sf "$SDKMANAGER" \
            "$ANDROID_HOME/tools/bin/sdkmanager"

          echo ""
          echo "Buildozer sdkmanager path:"
          ls -la "$ANDROID_HOME/tools/bin/sdkmanager"

          echo ""
          echo "Testing sdkmanager:"
          "$ANDROID_HOME/tools/bin/sdkmanager" --version

      - name: Check Android API
        run: |
          echo "========================================"
          echo "ANDROID API"
          echo "========================================"

          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "ERROR: Android API 35 not found"
            exit 1
          fi

          echo "Android API 35 OK"

      - name: Check Android NDK
        run: |
          echo "========================================"
          echo "ANDROID NDK"
          echo "========================================"

          if [ ! -d "$ANDROID_HOME/ndk/28.2.13676358" ]; then
            echo "ERROR: Android NDK 28.2.13676358 not found"
            exit 1
          fi

          echo "Android NDK 28.2.13676358 OK"

          echo ""
          echo "NDK source.properties:"
          cat "$ANDROID_HOME/ndk/28.2.13676358/source.properties"

      - name: Check Autotools
        run: |
          echo "========================================"
          echo "AUTOTOOLS"
          echo "========================================"

          echo ""
          echo "Autoconf:"
          autoconf --version

          echo ""
          echo "Automake:"
          automake --version

          echo ""
          echo "Libtool:"
          libtool --version

          echo ""
          echo "Libtoolize:"
          libtoolize --version

          echo ""
          echo "Libtool macro files:"
          find /usr/share \
            -type f \
            \( -name "libtool.m4" -o -name "ltdl.m4" \) \
            2>/dev/null \
            | head -30

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install buildozer

          pip install "cython==0.29.34"

      - name: Check Buildozer
        run: |
          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          javac -version

          echo ""
          echo "Pip:"
          pip --version

      - name: Clean previous build
        run: |
          echo "Cleaning Buildozer cache..."

          rm -rf .buildozer
          rm -rf bin
          rm -rf ~/.buildozer

          echo "Clean complete."

      - name: Verify Buildozer configuration
        run: |
          echo "========================================"
          echo "BUILDOZER CONFIGURATION"
          echo "========================================"

          echo ""
          echo "SDK:"
          grep -E "^android.sdk_path" buildozer.spec || true

          echo ""
          echo "NDK:"
          grep -E "^android.ndk_path" buildozer.spec || true

          echo ""
          echo "NDK version:"
          grep -E "^android.ndk" buildozer.spec || true

          echo ""
          echo "API:"
          grep -E "^android.api" buildozer.spec || true

          echo ""
          echo "Min API:"
          grep -E "^android.minapi" buildozer.spec || true

          echo ""
          echo "Architectures:"
          grep -E "^android.archs" buildozer.spec || true

          echo ""
          echo "Requirements:"
          grep -E "^requirements" buildozer.spec || true

      - name: Build APK
        run: |
          echo "========================================"
          echo "BUILDING APK"
          echo "========================================"

          buildozer android debug

      - name: Check APK
        run: |
          echo "========================================"
          echo "CHECK APK"
          echo "========================================"

          echo ""
          echo "APK files:"

          find bin \
            -type f \
            -name "*.apk" \
            -print

          echo ""

          APK=$(find bin \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "APK successfully created:"
          echo "$APK"

          echo ""
          echo "APK size:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: school-helper-apk
          path: bin/*.apk
          if-no-files-found: error

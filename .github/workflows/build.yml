name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

          echo ""
          echo "Installed Build Tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo ""
          echo "Installed NDK:"
          ls -la "$ANDROID_HOME/ndk"

          echo ""
          echo "Checking AIDL:"
          ls -la "$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo ""
          echo "Testing AIDL:"
          "$ANDROID_HOME/build-tools/35.0.0/aidl" --help >/dev/null

          echo "AIDL OK"

      - name: Fix sdkmanager path for Buildozer
        run: |
          echo "Searching for sdkmanager..."

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "Found sdkmanager: $SDKMANAGER"

          mkdir -p "$ANDROID_HOME/tools/bin"

          ln -sf "$SDKMANAGER" "$ANDROID_HOME/tools/bin/sdkmanager"

          echo ""
          echo "Buildozer sdkmanager path:"
          ls -la "$ANDROID_HOME/tools/bin/sdkmanager"

          echo ""
          echo "Testing sdkmanager:"
          "$ANDROID_HOME/tools/bin/sdkmanager" --version

      - name: Check Android API
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          echo "Android API 35 OK"

      - name: Check Android NDK
        run: |
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          echo "Android NDK 28.2.13676358 OK"
          cat "$ANDROID_HOME/ndk/28.2.13676358/source.properties"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install "cython==0.29.34"

      - name: Check Buildozer
        run: |
          buildozer --version
          python --version
          javac -version

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -rf ~/.buildozer

      - name: Verify Buildozer configuration
        run: |
          echo "SDK:"
          grep -E "^android.sdk_path" buildozer.spec

          echo "NDK:"
          grep -E "^android.ndk_path" buildozer.spec

          echo "API:"
          grep -E "^android.api" buildozer.spec

          echo "Architectures:"
          grep -E "^android.archs" buildozer.spec

      - name: Build APK
        run: |
          buildozer android debug

      - name: Check APK
        run: |
          echo "APK files:"
          find bin -type f -name "*.apk" -print

          test -n "$(find bin -type f -name '*.apk' -print -quit)"

          echo "APK successfully created!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: school-helper-apk
          path: bin/*.apk
          if-no-files-found: error
